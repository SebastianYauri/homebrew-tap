name: Follow new Clawdy releases

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Update the cask
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api repos/SebastianYauri/clawdy/releases/latest --jq .tag_name)
          v="${tag#v}"
          cur=$(sed -n 's/^  version "\(.*\)"/\1/p' Casks/clawdy.rb)
          if [ "$v" = "$cur" ]; then echo "already at $v"; exit 0; fi
          hash=$(curl -fsSL "https://github.com/SebastianYauri/clawdy/releases/download/v$v/Clawdy-mac.zip" | sha256sum | cut -d' ' -f1)
          sed -i -e "s/^  version \".*\"/  version \"$v\"/" -e "s/^  sha256 \".*\"/  sha256 \"$hash\"/" Casks/clawdy.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "clawdy: update to $v"
          git push
